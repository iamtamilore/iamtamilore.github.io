const TIER_ORDER = { TIER1: 0, TIER2: 1, TIER3: 2 };
const STATUS_ORDER = { live: 0, monitor_only: 1 };

let appState = {}; // id -> {applied, clicks, ...}

async function loadState() {
  const snap = await getDocs(collection(db, "applications"));
  snap.forEach(d => { appState[d.id] = d.data(); });
}

function stateFor(id) {
  return appState[id] || { applied: false, clicks: 0 };
}

function daysUntil(dateStr) {
  if (!dateStr) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

function pickTopJob() {
  const candidates = CATALOG.filter(j => !stateFor(j.id).applied);
  if (!candidates.length) return null;
  candidates.sort((a, b) => {
    const da = daysUntil(a.deadline_date), db_ = daysUntil(b.deadline_date);
    const aHard = a.deadline_date && da >= 0, bHard = b.deadline_date && db_ >= 0;
    if (aHard && bHard && da !== db_) return da - db_;
    if (aHard !== bHard) return aHard ? -1 : 1;
    if (TIER_ORDER[a.tier] !== TIER_ORDER[b.tier]) return TIER_ORDER[a.tier] - TIER_ORDER[b.tier];
    if (STATUS_ORDER[a.status] !== STATUS_ORDER[b.status]) return STATUS_ORDER[a.status] - STATUS_ORDER[b.status];
    return stateFor(a.id).clicks - stateFor(b.id).clicks;
  });
  return candidates[0];
}

async function recordClick(id) {
  const ref = doc(db, "applications", id);
  const prev = stateFor(id);
  appState[id] = { ...prev, clicks: (prev.clicks || 0) + 1, lastVisited: Date.now() };
  await setDoc(ref, { clicks: increment(1), lastVisited: serverTimestamp() }, { merge: true });
}

async function recordApplied(id, applied) {
  const ref = doc(db, "applications", id);
  appState[id] = { ...stateFor(id), applied };
  await setDoc(ref, { applied, appliedAt: applied ? serverTimestamp() : null }, { merge: true });
}

function renderTopCard() {
  const slot = document.getElementById("top-card-slot");
  const job = pickTopJob();
  if (!job) {
    slot.innerHTML = '<div class="top-card"><p class="done-msg">You have marked every role as applied. Nice work &mdash; check the full list below if new roles get added.</p></div>';
    return;
  }
  const st = stateFor(job.id);
  slot.innerHTML = `
    <div class="top-card">
      <div class="company">${job.company}</div>
      <div class="role">${job.role}</div>
      <div class="meta-row">
        <span class="pill">${job.location}</span>
        <span class="pill deadline">${job.deadline}</span>
        <span class="pill">${job.tier}</span>
      </div>
      <p class="why">${job.why_it_fits}</p>
      <a class="apply-btn" href="${job.url}" target="_blank" rel="noopener" id="apply-link">Open application &rarr;</a>
      <div class="yn-row">
        <button class="yn-btn no" id="btn-no">Not yet</button>
        <button class="yn-btn yes" id="btn-yes">Applied &#10003;</button>
      </div>
      ${st.clicks ? `<div class="clicks-note">opened ${st.clicks} time${st.clicks === 1 ? "" : "s"}</div>` : ""}
    </div>
  `;
  document.getElementById("apply-link").addEventListener("click", () => recordClick(job.id));
  document.getElementById("btn-yes").addEventListener("click", async () => {
    await recordApplied(job.id, true);
    renderAll();
  });
  document.getElementById("btn-no").addEventListener("click", () => {
    // "not yet" just re-renders (useful after opening the link) without marking applied
    renderAll();
  });
}

function renderFullList() {
  const wrap = document.getElementById("full-list");
  const byTier = { TIER1: [], TIER2: [], TIER3: [] };
  CATALOG.forEach(j => byTier[j.tier].push(j));
  const labels = { TIER1: "Tier 1 — apply first", TIER2: "Tier 2 — strong match", TIER3: "Tier 3 — worth monitoring" };
  let html = "";
  for (const tier of ["TIER1", "TIER2", "TIER3"]) {
    html += `<div class="tier-heading">${labels[tier]}</div>`;
    byTier[tier].forEach(j => {
      const st = stateFor(j.id);
      html += `
        <div class="job-row ${st.applied ? "applied" : ""}" data-id="${j.id}">
          <a href="${j.url}" target="_blank" rel="noopener" class="row-link" data-id="${j.id}">
            ${j.company}<span class="row-role">${j.role}</span>
          </a>
          <div class="row-right">
            ${st.clicks ? `<span class="status-tag">${st.clicks}x</span>` : ""}
            <button class="row-toggle ${st.applied ? "applied" : ""}" data-id="${j.id}">${st.applied ? "Applied" : "Mark applied"}</button>
          </div>
        </div>`;
    });
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll(".row-link").forEach(a => a.addEventListener("click", () => recordClick(a.dataset.id)));
  wrap.querySelectorAll(".row-toggle").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.id;
    await recordApplied(id, !stateFor(id).applied);
    renderAll();
  }));
}

function renderAll() {
  renderTopCard();
  renderFullList();
}

document.getElementById("list-toggle").addEventListener("click", (e) => {
  const btn = e.currentTarget;
  btn.classList.toggle("open");
  document.getElementById("full-list").classList.toggle("open");
});

(async function init() {
  try {
    await loadState();
  } catch (e) {
    console.error("Firestore load failed, showing catalog with local-only state.", e);
  }
  renderAll();
})();
</script>
