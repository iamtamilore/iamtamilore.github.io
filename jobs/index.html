const TIER_ORDER = { TIER1: 0, TIER2: 1, TIER3: 2 };
const POST_STATUS_ORDER = { live: 0, monitor_only: 1 }; // posting liveness, from the catalog itself

// Per-job application state, keyed by job id, synced via Firestore.
// appStatus: "new" | "viewed" | "snoozed" | "applied"
let appState = {};

async function loadState() {
  const snap = await getDocs(collection(db, "applications"));
  snap.forEach(d => { appState[d.id] = d.data(); });
}

function stateFor(id) {
  return appState[id] || { appStatus: "new", clicks: 0, notes: "" };
}

function daysUntil(dateStr) {
  if (!dateStr) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

function sortByUrgency(list) {
  return list.slice().sort((a, b) => {
    const da = daysUntil(a.deadline_date), db_ = daysUntil(b.deadline_date);
    const aHard = a.deadline_date && da >= 0, bHard = b.deadline_date && db_ >= 0;
    if (aHard && bHard && da !== db_) return da - db_;
    if (aHard !== bHard) return aHard ? -1 : 1;
    if (TIER_ORDER[a.tier] !== TIER_ORDER[b.tier]) return TIER_ORDER[a.tier] - TIER_ORDER[b.tier];
    if (POST_STATUS_ORDER[a.status] !== POST_STATUS_ORDER[b.status]) return POST_STATUS_ORDER[a.status] - POST_STATUS_ORDER[b.status];
    return stateFor(a.id).clicks - stateFor(b.id).clicks;
  });
}

function triageCandidates() {
  return sortByUrgency(CATALOG.filter(j => {
    const s = stateFor(j.id).appStatus;
    return s === "new" || s === "viewed" || !s;
  }));
}

async function writeState(id, patch) {
  const ref = doc(db, "applications", id);
  appState[id] = { ...stateFor(id), ...patch };
  const firestorePatch = { ...patch };
  if ("clicksIncrement" in firestorePatch) {
    delete firestorePatch.clicksIncrement;
    firestorePatch.clicks = increment(1);
  }
  await setDoc(ref, firestorePatch, { merge: true });
}

async function recordClick(id) {
  const prev = stateFor(id);
  const patch = { clicksIncrement: true, lastVisited: serverTimestamp() };
  if (prev.appStatus === "new" || !prev.appStatus) patch.appStatus = "viewed";
  appState[id] = { ...prev, clicks: (prev.clicks || 0) + 1 };
  await writeState(id, patch);
}

async function setAppStatus(id, appStatus) {
  const patch = { appStatus };
  patch.appliedAt = appStatus === "applied" ? serverTimestamp() : (stateFor(id).appliedAt ?? null);
  await writeState(id, patch);
  renderAll();
}

async function saveNote(id, notes) {
  await writeState(id, { notes });
}

function progressCounts() {
  const total = CATALOG.length;
  const applied = CATALOG.filter(j => stateFor(j.id).appStatus === "applied").length;
  const urgent = CATALOG.filter(j => {
    const s = stateFor(j.id).appStatus;
    if (s === "applied" || s === "snoozed") return false;
    const d = daysUntil(j.deadline_date);
    return j.deadline_date && d >= 0 && d <= 7;
  }).length;
  return { total, applied, urgent };
}

function renderProgress() {
  const { total, applied, urgent } = progressCounts();
  document.getElementById("progress-line").innerHTML =
    `<strong>${applied}/${total}</strong> applied${urgent ? ` &middot; <strong>${urgent}</strong> urgent (due within 7 days)` : ""}`;
  document.getElementById("progress-fill").style.width = total ? `${(applied / total) * 100}%` : "0%";
}

function renderTopCard() {
  const slot = document.getElementById("top-card-slot");
  const candidates = triageCandidates();
  const job = candidates[0];
  if (!job) {
    slot.innerHTML = '<div class="top-card"><p class="done-msg">Nothing left to triage &mdash; check Snoozed roles in the All tab, or you are caught up.</p></div>';
    return;
  }
  const st = stateFor(job.id);
  slot.innerHTML = `
    <div class="top-card">
      <div class="company">${job.company}</div>
      <div class="role">${job.role}</div>
      <div class="meta-row">
        <span class="pill">${job.location}</span>
        <span class="pill deadline">${job.deadline}</span>
        <span class="pill">${job.tier}</span>
      </div>
      <p class="why">${job.why_it_fits}</p>
      <a class="apply-btn" href="${job.url}" target="_blank" rel="noopener" id="apply-link">Open application &rarr;</a>
      <div class="action-row">
        <button class="act-btn snooze" id="btn-snooze">Snooze</button>
        <button class="act-btn applied" id="btn-applied">Applied &#10003;</button>
      </div>
      ${st.clicks ? `<div class="clicks-note">opened ${st.clicks} time${st.clicks === 1 ? "" : "s"}</div>` : ""}
    </div>
  `;
  document.getElementById("apply-link").addEventListener("click", () => recordClick(job.id));
  document.getElementById("btn-applied").addEventListener("click", () => setAppStatus(job.id, "applied"));
  document.getElementById("btn-snooze").addEventListener("click", () => setAppStatus(job.id, "snoozed"));
}

function renderTriageList() {
  const wrap = document.getElementById("triage-list");
  const candidates = triageCandidates().slice(1); // everything after the top card
  if (!candidates.length) {
    wrap.innerHTML = '<p class="empty-note">Nothing else queued right now.</p>';
    return;
  }
  wrap.innerHTML = candidates.map(j => jobRowHtml(j)).join("");
  wireJobRows(wrap);
}

function renderAppliedList() {
  const wrap = document.getElementById("applied-list");
  const applied = CATALOG.filter(j => stateFor(j.id).appStatus === "applied");
  if (!applied.length) {
    wrap.innerHTML = '<p class="empty-note">Nothing marked applied yet. Anything you mark here can always be undone.</p>';
    return;
  }
  applied.sort((a, b) => {
    const ta = stateFor(a.id).appliedAt?.toMillis?.() || 0;
    const tb = stateFor(b.id).appliedAt?.toMillis?.() || 0;
    return tb - ta;
  });
  wrap.innerHTML = applied.map(j => {
    const st = stateFor(j.id);
    const when = st.appliedAt?.toDate ? st.appliedAt.toDate().toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "recently";
    return `
      <div class="applied-row">
        <div>
          <div class="ar-company">${j.company}</div>
          <div class="ar-role">${j.role}</div>
          <div class="ar-when">applied ${when}</div>
        </div>
        <button class="undo-btn" data-id="${j.id}">Undo</button>
      </div>`;
  }).join("");
  wrap.querySelectorAll(".undo-btn").forEach(btn => btn.addEventListener("click", () => setAppStatus(btn.dataset.id, "viewed")));
}

function jobRowHtml(j) {
  const st = stateFor(j.id);
  const applied = st.appStatus === "applied";
  const snoozed = st.appStatus === "snoozed";
  return `
    <div class="job-row" data-id="${j.id}">
      <div class="row-top">
        <a href="${j.url}" target="_blank" rel="noopener" class="row-link" data-id="${j.id}">
          ${j.company}<span class="row-role">${j.role} &middot; ${j.deadline}</span>
        </a>
        <div class="row-right">
          ${st.clicks ? `<span class="status-tag">${st.clicks}x</span>` : ""}
          <button class="row-btn ${applied ? "applied" : ""} ${snoozed ? "snoozed" : ""}" data-id="${j.id}" data-action="toggle-applied">
            ${applied ? "Applied" : snoozed ? "Snoozed" : "Mark applied"}
          </button>
        </div>
      </div>
      <button class="note-toggle" data-id="${j.id}" data-action="toggle-note">${st.notes ? "&#9998; note" : "+ note"}</button>
      <div style="display:none;" data-id="${j.id}" data-role="note-wrap">
        <textarea class="row-note" rows="2" placeholder="e.g. needs cover letter tailored to telco CDR scale" data-id="${j.id}">${st.notes || ""}</textarea>
      </div>
    </div>`;
}

function wireJobRows(wrap) {
  wrap.querySelectorAll(".row-link").forEach(a => a.addEventListener("click", () => recordClick(a.dataset.id)));
  wrap.querySelectorAll('[data-action="toggle-applied"]').forEach(btn => btn.addEventListener("click", () => {
    const id = btn.dataset.id;
    const cur = stateFor(id).appStatus;
    setAppStatus(id, cur === "applied" ? "viewed" : "applied");
  }));
  wrap.querySelectorAll('[data-action="toggle-note"]').forEach(btn => btn.addEventListener("click", () => {
    const row = wrap.querySelector(`[data-role="note-wrap"][data-id="${btn.dataset.id}"]`);
    row.style.display = row.style.display === "none" ? "block" : "none";
  }));
  wrap.querySelectorAll(".row-note").forEach(ta => ta.addEventListener("blur", () => saveNote(ta.dataset.id, ta.value)));
}

function renderAllList() {
  const wrap = document.getElementById("all-list");
  const byTier = { TIER1: [], TIER2: [], TIER3: [] };
  const snoozed = [];
  CATALOG.forEach(j => {
    if (stateFor(j.id).appStatus === "snoozed") snoozed.push(j);
    else byTier[j.tier].push(j);
  });
  const labels = { TIER1: "Tier 1 — apply first", TIER2: "Tier 2 — strong match", TIER3: "Tier 3 — worth monitoring" };
  let html = "";
  for (const tier of ["TIER1", "TIER2", "TIER3"]) {
    html += `<div class="tier-heading">${labels[tier]}</div>`;
    html += sortByUrgency(byTier[tier]).map(j => jobRowHtml(j)).join("");
  }
  if (snoozed.length) {
    html += `<div class="tier-heading">Snoozed</div>`;
    html += sortByUrgency(snoozed).map(j => jobRowHtml(j)).join("");
  }
  wrap.innerHTML = html;
  wireJobRows(wrap);
}

function renderAll() {
  renderProgress();
  renderTopCard();
  renderTriageList();
  renderAppliedList();
  renderAllList();
}

document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
}));

(async function init() {
  try {
    await loadState();
  } catch (e) {
    console.error("Firestore load failed, showing catalog with local-only state.", e);
  }
  renderAll();
})();
</script>
